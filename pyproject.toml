[project]
name = "fund-checklist"
version = "0.1.0"
description = "基金年报分析助手"
requires-python = ">=3.11"
dependencies = [
    "docling>=2.90.0,<3.0.0",
    "rich>=13.0.0",
]

[project.scripts]
fund-checklist = "fund_agent.cli.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fund_agent*"]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "e2e: 端到端测试（需要真实 PDF 数据，CI 前需运行 scripts/setup_e2e_data.py）",
]
